[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lks-idprovider-fastapi"
version = "0.1.1"
description = "Provider-agnostic FastAPI integration for lks-idprovider API protocols."
authors = [
    {name = "Raul Medeiros", email = "rmedeiros@lksnext.com"}
]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.142.0,<0.143.0",
    "lks-idprovider-api>=0.1.6,<0.2.0"
]

[project.urls]
Homepage = "https://github.com/lksnext-ai-lab/lks-idprovider"
Repository = "https://github.com/lksnext-ai-lab/lks-idprovider"
Documentation = "https://github.com/lksnext-ai-lab/lks-idprovider#readme"
Issues = "https://github.com/lksnext-ai-lab/lks-idprovider/issues"

[tool.uv.sources]
lks-idprovider-api = { workspace = true }
lks-idprovider-keycloak = { workspace = true }
lks-idprovider-entraid = { workspace = true }

[tool.poetry]
packages = [{include = "lks_idprovider_fastapi", from = "src"}]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.1,<0.29.0",
    "pyright>=1.1.402",
    "lks-idprovider-keycloak>=0.1.1,<0.2.0",
    "lks-idprovider-entraid>=0.1.0,<0.2.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env_files = [".env", ".env.test"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "asyncio: marks tests as async tests",
]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "lks_idprovider_fastapi.requires_role",
    "lks_idprovider_fastapi.requires_any_role",
    "lks_idprovider_fastapi.dependencies.requires_role",
    "lks_idprovider_fastapi.dependencies.requires_any_role",
]

[tool.ruff.lint.isort]
known-first-party = ["lks_idprovider_fastapi", "lks_idprovider"]
